version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      nuxt:
        patterns:
          - "@nuxt/*"
          - "nuxt"
      vue:
        patterns:
          - "vue"
          - "vue-*"
          - "@vue/*"
      vueuse:
        patterns:
          - "@vueuse/*"
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
      dev-dependencies:
        dependency-type: development
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
