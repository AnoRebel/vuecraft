<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Vuecraft Logo: A faceted gem forming a "V" shape -->

  <!-- Background circle (optional, can be removed for transparent) -->
  <circle cx="32" cy="32" r="30" fill="currentColor" opacity="0.1"/>

  <!-- Main V shape - left facet -->
  <path d="M12 16 L32 52 L32 36 L20 16 Z" fill="currentColor" opacity="0.9"/>

  <!-- Main V shape - right facet -->
  <path d="M52 16 L32 52 L32 36 L44 16 Z" fill="currentColor" opacity="0.7"/>

  <!-- Inner highlight - left -->
  <path d="M20 16 L32 36 L28 16 Z" fill="currentColor" opacity="0.5"/>

  <!-- Inner highlight - right -->
  <path d="M44 16 L32 36 L36 16 Z" fill="currentColor" opacity="0.3"/>

  <!-- Top sparkle/craft element -->
  <path d="M32 8 L34 12 L38 14 L34 16 L32 20 L30 16 L26 14 L30 12 Z" fill="currentColor"/>

  <!-- Small accent sparkles -->
  <circle cx="18" cy="24" r="1.5" fill="currentColor" opacity="0.6"/>
  <circle cx="46" cy="24" r="1.5" fill="currentColor" opacity="0.6"/>
</svg>
