<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Gradient for gem effect -->
    <linearGradient id="gemGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#41B883">
        <animate attributeName="stop-color" values="#41B883;#34495E;#41B883" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" style="stop-color:#34495E">
        <animate attributeName="stop-color" values="#34495E;#41B883;#34495E" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#41B883">
        <animate attributeName="stop-color" values="#41B883;#34495E;#41B883" dur="3s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Shimmer gradient -->
    <linearGradient id="shimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:white;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:white;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:white;stop-opacity:0"/>
      <animate attributeName="x1" values="-100%;100%" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0%;200%" dur="2s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>

  <!-- Background glow -->
  <circle cx="32" cy="32" r="28" fill="url(#gemGradient)" opacity="0.15">
    <animate attributeName="r" values="28;30;28" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- Main V shape - left facet -->
  <path d="M12 16 L32 52 L32 36 L20 16 Z" fill="#41B883">
    <animate attributeName="opacity" values="0.9;1;0.9" dur="2s" repeatCount="indefinite"/>
  </path>

  <!-- Main V shape - right facet -->
  <path d="M52 16 L32 52 L32 36 L44 16 Z" fill="#34495E">
    <animate attributeName="opacity" values="0.8;0.9;0.8" dur="2s" repeatCount="indefinite" begin="0.5s"/>
  </path>

  <!-- Inner highlight - left -->
  <path d="M20 16 L32 36 L28 16 Z" fill="#3EAF7C"/>

  <!-- Inner highlight - right -->
  <path d="M44 16 L32 36 L36 16 Z" fill="#2C3E50"/>

  <!-- Shimmer overlay -->
  <path d="M12 16 L32 52 L52 16 L44 16 L32 36 L20 16 Z" fill="url(#shimmer)" opacity="0.5"/>

  <!-- Top sparkle/craft element with animation -->
  <g>
    <path d="M32 8 L34 12 L38 14 L34 16 L32 20 L30 16 L26 14 L30 12 Z" fill="#41B883">
      <animate attributeName="opacity" values="1;0.5;1" dur="1.5s" repeatCount="indefinite"/>
    </path>
    <animateTransform attributeName="transform" type="scale" values="1;1.1;1" dur="1.5s" repeatCount="indefinite" additive="sum"/>
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-1;0,0" dur="1.5s" repeatCount="indefinite" additive="sum"/>
  </g>

  <!-- Floating sparkle particles -->
  <circle cx="18" cy="24" r="1.5" fill="#41B883">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="r" values="1.5;2;1.5" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="46" cy="24" r="1.5" fill="#41B883">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite" begin="1s"/>
    <animate attributeName="r" values="1.5;2;1.5" dur="2s" repeatCount="indefinite" begin="1s"/>
  </circle>

  <!-- Additional floating particles -->
  <circle cx="24" cy="44" r="1" fill="#3EAF7C">
    <animate attributeName="cy" values="44;40;44" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.8;0" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="40" cy="44" r="1" fill="#3EAF7C">
    <animate attributeName="cy" values="44;40;44" dur="3s" repeatCount="indefinite" begin="1.5s"/>
    <animate attributeName="opacity" values="0;0.8;0" dur="3s" repeatCount="indefinite" begin="1.5s"/>
  </circle>
</svg>
